[package]
name = "comfyui-installer"
version = "0.1.3"
description = "Arch/CachyOS ComfyUI launcher"
authors = ["Arkaikus"]
edition = "2021"
license = "MIT"

[lib]
name = "comfyui_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "comfyui-installer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
webdriver = ["tauri-plugin-wdio-webdriver"]

[dependencies]
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
thiserror = "2"
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
which = "7"
